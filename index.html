<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THIÊN LONG - Tìm kiếm Câu hỏi & Đáp án</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#101b3a;
      --card: rgba(255,255,255,.08);
      --card2: rgba(255,255,255,.12);
      --text:#eaf0ff;
      --muted: rgba(234,240,255,.75);
      --border: rgba(255,255,255,.18);
      --blue: #2d9cff;
      --blueSoft: rgba(45,156,255,.18);
      --shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(45,156,255,.18), transparent 60%),
        radial-gradient(900px 600px at 85% 30%, rgba(255,110,199,.12), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      overflow-x:hidden;
    }
    .wrap{
      min-height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:32px 14px 56px;
      gap:18px;
    }
    .hero{
      width:min(980px, 100%);
      position:relative;
      padding:44px 18px 26px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .watermark{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:min(18vw, 168px);
      color:rgba(255,255,255,.08);
      filter: blur(.2px);
      user-select:none;
      pointer-events:none;
      transform: translateY(6px);
    }
    .card{
      width:min(760px, 100%);
      background: var(--card);
      border:1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius:18px;
      backdrop-filter: blur(10px);
      padding:18px 18px 16px;
      position:relative;
      z-index:1;
    }
    .title{
      display:flex;
      flex-direction:column;
      gap:4px;
      text-align:center;
      margin-bottom:12px;
    }
    .title h1{
      margin:0;
      font-size:18px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:rgba(234,240,255,.92);
    }
    .title p{margin:0; color:var(--muted); font-size:13px}
    .searchRow{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
    }
    .searchRow input{
      width:min(620px, 100%);
      padding:14px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.22);
      background: rgba(5,10,22,.55);
      color:var(--text);
      outline:none;
      font-size:15px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
    }
    .searchRow input:focus{
      border-color: rgba(45,156,255,.75);
      box-shadow: 0 0 0 4px rgba(45,156,255,.18), inset 0 0 0 1px rgba(0,0,0,.25);
    }
    .btns{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }
    button{
      border:none;
      border-radius:12px;
      padding:11px 14px;
      font-weight:700;
      cursor:pointer;
      transition: transform .06s ease, filter .12s ease, background .12s ease;
    }
    button:active{transform: translateY(1px)}
    .btnPrimary{
      background: linear-gradient(180deg, rgba(45,156,255,1), rgba(14,116,230,1));
      color:white;
      min-width:140px;
    }
    .btnGhost{
      background: rgba(255,255,255,.08);
      color: rgba(234,240,255,.92);
      border:1px solid rgba(255,255,255,.18);
      min-width:140px;
    }
    .hint{
      margin-top:10px;
      font-size:12px;
      color: rgba(234,240,255,.72);
      text-align:center;
    }
    .hint code{
      background: rgba(255,255,255,.08);
      padding:2px 6px;
      border-radius:8px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .resultsWrap{
      width:min(980px, 100%);
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:6px;
    }
    .metaBar{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(8px);
    }
    .metaBar .left{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .metaBar .count{
      font-weight:800;
      letter-spacing:.02em;
    }
    .metaBar .sub{
      color:rgba(234,240,255,.72);
      font-size:12px;
    }
    .metaBar .right{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .chip{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: rgba(234,240,255,.88);
      user-select:none;
    }
    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .item{
      background: var(--card);
      border:1px solid rgba(255,255,255,.14);
      border-radius:16px;
      padding:12px 12px;
      box-shadow: 0 14px 40px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
    }
    .itemTop{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom:10px;
    }
    .sec{
      font-size:12px;
      color: rgba(234,240,255,.74);
    }
    .q{
      font-size:15px;
      line-height:1.45;
      font-weight:750;
    }
    .opts{
      display:grid;
      grid-template-columns: 1fr;
      gap:8px;
      margin: 10px 0 10px;
    }
    @media (min-width: 720px){
      .opts{grid-template-columns: 1fr 1fr}
    }
    .opt{
      padding:10px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      line-height:1.35;
    }
    .opt .label{
      display:inline-flex;
      width:22px;
      height:22px;
      align-items:center;
      justify-content:center;
      border-radius:8px;
      margin-right:8px;
      font-weight:900;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.18);
    }
    .opt.correct{
      border-color: rgba(45,156,255,.55);
      background: var(--blueSoft);
      box-shadow: inset 0 0 0 1px rgba(45,156,255,.22);
    }
    .opt.correct .label{
      border-color: rgba(45,156,255,.75);
      background: rgba(45,156,255,.22);
      color: rgba(234,240,255,.98);
    }
    .answer{
      margin-top:8px;
      padding:10px 10px;
      border-radius:12px;
      border:1px solid rgba(45,156,255,.55);
      background: rgba(45,156,255,.14);
      color: rgba(234,240,255,.95);
      white-space: pre-line;
      font-weight:750;
    }
    .empty{
      padding:16px 14px;
      border-radius:14px;
      border:1px dashed rgba(255,255,255,.22);
      background: rgba(255,255,255,.05);
      color: rgba(234,240,255,.75);
      text-align:center;
    }
    footer{
      width:min(980px, 100%);
      margin-top:18px;
      color: rgba(234,240,255,.55);
      font-size:12px;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="watermark">THIEN&nbsp;LONG</div>

      <div class="card" role="search">
        <div class="title">
          <h1>THIENLONG.COM</h1>
          <p>Tìm kiếm câu hỏi &amp; đáp án (có bôi xanh đáp án đúng)</p>

        <div class="hint">
         
        </div>
      </div>
    </div>

          <div class="chip" id="chipTotal"></div>
          <div class="chip" id="chipShown"></div>

      </div>

      <div class="list" id="list"></div>
      <div id="moreWrap" style="display:none; text-align:center; margin-top:8px;">
        <button class="btnGhost" id="btnMore">TẢI THÊM</button>
      </div>

      <div class="empty" id="empty">
        Nhập từ khóa ở ô tìm kiếm để bắt đầu.
      </div>
    </div>

    <footer>
      Dữ liệu câu hỏi/đáp án được nạp trực tiếp từ tệp bạn cung cấp.
    </footer>
  </div>

ột vũ trang hiện đại và ngăn ngừa suy thoái chính trị, tư tưởng, đạo đức"}, {"label": "d", "text": "Ngăn ngừa nguy cơ chiến tranh, xung đột vũ trang và ngăn ngừa suy thoái tư tưởng, đạo đức"}], "answer": "b.", "correct": ["b"]}, {"id": 226, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 9, "question": "Nội dung “Năm tránh” theo tinh thần của đồng chí Chính uỷ Quân khu 5 là?", "options": [{"label": "a", "text": "“Tránh buông lỏng nguyên tắc, coi thường kỷ luật, kỷ cương; tránh để mất đoàn kết, mềm dẻo nhưng cương quyết; tránh làm việc theo lối mòn kinh nghiệm; tránh thấy đúng không bảo vệ, thấy sai không đấu tranh; tránh bệnh thành tích, báo cáo không đúng sự thật, che giấu khuyết điểm”"}, {"label": "b", "text": "“Tránh buông lỏng nguyên tắc, coi thường kỷ cương; tránh để mất đoàn kết, mềm dẻo nhưng cương quyết; tránh làm việc theo lối mòn kinh nghiệm, không đổi mới; tránh thấy đúng không bảo vệ, thấy sai không đấu tranh; tránh bệnh thành tích, báo cáo không đúng sự thật, che giấu khuyết điểm”"}, {"label": "c", "text": "“Tránh buông lỏng nguyên tắc, coi thường kỷ cương; tránh để mất đoàn kết, mềm dẻo nhưng cương quyết; tránh làm việc theo lối mòn kinh nghiệm; tránh thấy đúng không bảo vệ, thấy sai không phế phán, đấu tranh; tránh bệnh thành tích, báo cáo không đúng sự thật, che giấu khuyết điểm”"}, {"label": "d", "text": "“Tránh buông lỏng nguyên tắc, coi thường kỷ cương; tránh để mất đoàn kết, mềm dẻo nhưng cương quyết; tránh làm việc theo lối mòn kinh nghiệm; tránh thấy đúng không bảo vệ, thấy sai không đấu tranh; tránh bệnh thành tích, báo cáo không đúng sự thật, che giấu khuyết điểm”"}], "answer": "d.", "correct": ["d"]}, {"id": 227, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 10, "question": "Nội dung nào sau đây không đúng khi nói về vai trò của “Bộ tứ trụ cột Nghị quyết”?", "options": [{"label": "a", "text": "Đổi mới tư duy phát triển toàn diện, khơi thông nguồn lực"}, {"label": "b", "text": "Đưa đất nước Việt Nam bứt phá, hội nhập sâu rộng trong kỷ nguyên mới"}, {"label": "c", "text": "Giải quyết được những vấn đề tồn đọng trước mắt về kinh tế"}, {"label": "d", "text": "Là đòn bẩy chiến lược để nước Việt Nam cất cánh, chuyển đổi mô hình tăng trưởng, hướng tới mục tiêu trở thành quốc gia phát triển, thu nhập cao"}], "answer": "c.", "correct": ["c"]}, {"id": 228, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 1, "question": "Nhiệm vụ của quân và dân Liên khu 5 trong năm 1948 là gì ?", "options": [{"label": "a", "text": "Đẩy mạnh chiến tranh du kích vùng địch tạm chiếm, đánh bại kế hoạch “bình định” của địch, biến hậu phương địch thành tiền phương của ta."}, {"label": "b", "text": "Xây dựng và củng cố vùng tự do thành căn cứ vững chắc, thành hậu phương chiến lược trực tiếp của chiến trường Liên khu 5, Nam Lào và Đông Bắc Campuchia."}, {"label": "c", "text": "Phối hợp với cách mạng 2 nước Lào và Campuchia phát động chiến tranh du kích, xây dựng thế trận đánh địch ở khu vực biên giới 3 nước Đông Dương."}, {"label": "d", "text": "Bao vây, bóp nghẹt, làm suy yếu hậu phương của địch."}], "answer": "a, b và c.", "correct": ["a", "b", "c"]}, {"id": 229, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 2, "question": "Chủ trương về quân sự của Liên khu 5 trong năm 1948 là gì ?", "options": [{"label": "a", "text": "Chấn chỉnh tổ chức lực lượng bộ đội chủ lực, bộ đội địa phương cho phù hợp, tích cực luyện tập nâng cao sức chiến đấu, phát triển rộng khắp phong trào dân quân du kích."}, {"label": "a", "text": "Đẩy mạnh phòng thủ bảo vệ vùng tự do."}, {"label": "c", "text": "Cường tập, kỳ tập đánh tiêu diệt các cứ điểm, đồn bốt quy mô nhỏ do đại đội, trung đội địch đóng giữ."}, {"label": "d", "text": "Mở rộng các xưởng quân giới, sản xuất nhiều vũ khí đạn dược cho cả lực lượng chủ lực và dân quân du kích."}], "answer": "a, b và d.", "correct": ["a", "b", "d"]}, {"id": 230, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 3, "question": "Đại hội Đảng bộ Liên khu lần thứ II (họp từ ngày 16/7 - 21/8/1951) đã xác định Yêu cầu nhiệm vụ chính trị đối với Nam Trung Bộ là gì ?", "options": [{"label": "a", "text": "Nâng cao hơn nữa chất lượng hiệu quả chiến đấu, phát động cho được một cao trào du kích chiến tranh, liên tục tiến công địch khắp vùng bị tạm chiếm."}, {"label": "b", "text": "Chỉnh huấn, chỉnh quân để chuẩn bị cho giai đoạn chiến đấu mới."}, {"label": "c", "text": "Nâng cao sức chiến đấu, trình độ kỹ chiến thuật của bộ đội."}, {"label": "d", "text": "Cử quân tình nguyện sang Nam Lào và Đông Bắc Campuchia phối hợp với lực lượng bạn vừa tác chiến, vừa xây dựng cơ sở."}], "answer": "a.", "correct": ["a"]}, {"id": 231, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 4, "question": "Hội nghị Liên khu ủy, Đảng ủy - Bộ Tư lệnh Liên khu 5 đầu tháng 12/1953 quyết định vấn đề gì ?", "options": [{"label": "a", "text": "Củng cố mở rộng vùng căn cứ du kích sau lưng địch, xây dựng và bảo vệ vùng tự do ngày càng vững chắc."}, {"label": "b", "text": "Đẩy mạnh hoạt động tác chiến đánh tiêu hao tiêu diệt, cầm chân địch làm chúng bị động đối phó khắp nơi."}, {"label": "c", "text": "Tập trung toàn bộ chủ lực cho nhiệm vụ tiến công Tây Nguyên, đánh chắc thắng chắc và thắng ngay trận đầu."}, {"label": "d", "text": "Nối liền vùng tự do Nam - Ngãi với căn cứ cách mạng của bạn ở Nam Lào, Đông Bắc Campuchia."}], "answer": "c.", "correct": ["c"]}, {"id": 232, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 5, "question": "Trong năm 1965, đã hình thành phong trào gì trong LLVT Quân khu 5 ?", "options": [{"label": "a", "text": "“Một ngày bằng 20 năm”."}, {"label": "b", "text": "“Đạp lên đầu thù xốc tới”."}, {"label": "c", "text": "“Tất cả cho phía trước, tất cả để giải phóng miền Nam”"}, {"label": "d", "text": "“Tìm Mỹ mà đánh, tìm ngụy mà diệt”"}], "answer": "d.", "correct": ["d"]}, {"id": 233, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 6, "question": "Trong năm 1975, trên địa bàn Quân khu 5 diễn ra những chiến dịch lớn nào ?", "options": [{"label": "a", "text": "Chiến dịch Tây Nguyên, Chiến dịch Huế - Đà Nẵng."}, {"label": "b", "text": "Chiến dịch đường 9 Nam Lào."}, {"label": "c", "text": "Chiến dịch Cánh đồng Chum - Xiêng Khoản."}, {"label": "d", "text": "Chiến dịch Bắc Tây Nguyên, Chiến dịch Huế - Đà Nẵng."}], "answer": "a.", "correct": ["a"]}, {"id": 234, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 7, "question": "Để đáp ứng yêu cầu nhiệm vụ chiến đấu bảo vệ biên giới Tây Nam, làm nhiệm vụ quốc tế, Quân khu 5 đã thành lập mới 3 sư đoàn nào ?", "options": [{"label": "a", "text": "Sư đoàn 3, Sư đoàn 309 và Sư đoàn 315."}, {"label": "b", "text": "Sư đoàn 307, Sư đoàn 309 và Sư đoàn 315."}, {"label": "b", "text": "Sư đoàn 307, Sư đoàn 9 và Sư đoàn 315."}, {"label": "b", "text": "Sư đoàn 307, Sư đoàn 309 và Sư đoàn 5."}], "answer": "b.", "correct": ["b"]}, {"id": 235, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 8, "question": "Truyền thống vẻ vang của Quân khu 5 là gì ?", "options": [{"label": "a", "text": "“Tự lực tự cường, khắc phục khó khăn, chịu đựng gian khổ, mưu trí sáng tạo, chiến đấu kiên cường, chiến thắng vẻ vang”."}, {"label": "b", "text": "“Trung thành anh dũng, mưu trí sáng tạo, khoa học chuẩn xác, đoàn kết hiệp đồng, trưởng thành toàn diện”."}, {"label": "c", "text": "“Đoàn kết, chủ động, sáng tạo, hy sinh, chiến thắng”."}, {"label": "d", "text": "“Đoàn kết, chủ động, kiên trung, chiến thắng”."}], "answer": "a.", "correct": ["a"]}, {"id": 236, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 9, "question": "Nét tiêu biểu Truyền thống của Quân khu 5 là gì ?", "options": [{"label": "a", "text": "Vượt qua mọi khó khăn, gian khổ, vừa chiến đấu, vừa xây dựng, không ngừng lớn mạnh và trưởng thành."}, {"label": "b", "text": "Đề cao trách nhiệm, giữ tốt, dùng bền, an toàn, tiết kiệm, không tham nhũng, lãng phí."}, {"label": "c", "text": "Luôn nêu cao tinh thần độc lập tự chủ, tự lực tự cường vượt qua khó khăn, gian khổ, hoàn thành xuất sắc nhiệm vụ được giao."}, {"label": "d", "text": "Lao động sáng tạo, có kỹ thuật, có kỷ luật, đạt năng suất, chất lượng, hiệu quả cao, luôn luôn vươn lên làm chủ vũ khí trang bị, khoa học công nghệ hiện đại."}], "answer": "c.", "correct": ["c"]}, {"id": 237, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 10, "question": "Nét tiêu biểu Truyền thống của Quân khu 5 là gì ?", "options": [{"label": "a", "text": "Luôn nêu cao tinh thần quốc tế cao cả, đoàn kết thủy chung, trọn nghĩa vẹn tình với hai nước bạn Lào và Campuchia."}, {"label": "b", "text": "Đoàn kết thủy chung son sắt, chí nghĩa, chí tình với bạn bè quốc tế."}, {"label": "c", "text": "Luôn tăng cường củng cố tình đoàn kết với các nước láng giềng, nhất là hai nước bạn Lào và Campuchia."}, {"label": "d", "text": "Xây dựng tình đoàn kết hữu nghị giữa các dân tộc, chống áp bức, bóc lột, cường quyền vì mục tiêu hòa bình, tiến bộ của nhân loại."}], "answer": "a.", "correct": ["a"]}, {"id": 238, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 1, "question": "Tư tưởng Hồ Chí Minh về vai trò của người cán bộ trong phát huy tinh thần đổi mới, sáng tạo là gì ?", "options": [{"label": "a", "text": "“Cán bộ là cái gốc của mọi công việc”."}, {"label": "b", "text": "Cán bộ, đảng viên là lực lượng tiên phong trong đổi mới, sáng tạo."}, {"label": "c", "text": "“Muôn việc thành công hay thất bại, đều do cán bộ tốt hay kém”."}, {"label": "d", "text": "Đổi mới, sáng tạo của cán bộ, đảng viên không chỉ dừng lại ở việc thay đổi phương pháp công tác mà còn là khả năng tìm kiếm những cách làm phù hợp, hiệu quả hơn."}], "answer": "b.", "correct": ["b"]}, {"id": 239, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 2, "question": "Tư tưởng Hồ Chí Minh về đổi mới, sáng tạo phải gắn với nhiệm vụ chính trị và yêu cầu thực tiễn của quân đội yêu cầu như thế nào ?", "options": [{"label": "a", "text": "Phải có dũng khí để thực hiện những ý tưởng đổi mới và sáng tạo."}, {"label": "b", "text": "Tinh thần đổi mới và sáng tạo được thể hiện qua việc hoàn thành nhiệm vụ được giao."}, {"label": "c", "text": "“Chúng ta không sợ sai lầm, nhưng đã nhận biết sai lầm thì phải ra sức sửa chữa”."}, {"label": "d", "text": "“Đổi mới không phải là xa rời lý tưởng, mà là cách để thực hiện lý tưởng một cách tốt hơn, hiệu quả hơn”."}], "answer": "d.", "correct": ["d"]}, {"id": 240, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 3, "question": "Quy định số 144-QĐ/TW ngày 09/5/2024 của Bộ Chính trị về chuẩn mực đạo đức cách mạng của cán bộ, đảng viên trong giai đoạn mới đề ra 05 chuẩn mực đạo đức cách mạng cho cán bộ, đảng viên trong giai đoạn mới, trong đó có nội dung nào sau đây ?", "options": [{"label": "a", "text": "Bản lĩnh, đổi mới, sáng tạo, hội nhập."}, {"label": "b", "text": "Năng động, sáng tạo, dám nghĩ, dám làm, dám chịu trách nhiệm vì lợi ích chung."}, {"label": "c", "text": "Năng động, sáng tạo, dám nghĩ, dám làm, dám chịu trách nhiệm và vì nhân dân phục vụ."}, {"label": "d", "text": "Có kiến thức và năng lực tiếp thu và cụ thể hóa các nghị quyết của Đảng."}], "answer": "a.", "correct": ["a"]}, {"id": 241, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 4, "question": "Một trong những giải pháp phát huy tinh thần đổi mới, sáng tạo của đội ngũ cán bộ, đảng viên góp phần xây dựng cơ quan, đơn vị vững mạnh toàn diện “mẫu mực, tiêu biểu” là gì ?", "options": [{"label": "a", "text": "Đẩy mạnh việc giáo dục để cấp ủy, chỉ huy các cấp và đội ngũ cán bộ, đảng viên."}, {"label": "b", "text": "Nâng cao nhận thức về vai trò của đổi mới, sáng tạo trong việc thực hiện nhiệm vụ chính trị."}, {"label": "c", "text": "Đẩy mạnh tuyên truyền, giáo dục nâng cao nhận thức cho cán bộ, đảng viên về vai trò và giá trị của đổi mới, sáng tạo."}, {"label": "d", "text": "Đổi mới nội dung và phương pháp tuyên truyền, giáo dục."}], "answer": "c.", "correct": ["c"]}, {"id": 242, "section": "IV. NỘI DUNG VỀ BỘ TỨ TRỤ CỘT NGHỊ QUYẾT; TINH THẦN ĐỔI MỚI, SÁNG TẠO CỦA CÁN BỘ, ĐẢNG VIÊN (10 CÂU)", "qnum": 5, "question": "Một trong những giải pháp chủ yếu để phát huy tinh thần đổi mới, sáng tạo của đội ngũ cán bộ, đảng viên góp phần xây dựng cơ quan, đơn vị vững mạnh toàn diện “mẫu mực, tiêu biểu” là gì ?", "options": [{"label": "a", "text": "Xây dựng cơ chế, chính sách hỗ trợ sát thực tiễn; tạo điều kiện để tư duy đổi mới, cách làm sáng tạo được hiện thực hóa."}, {"label": "b", "text": "Xây dựng cơ chế, chính sách hỗ trợ thực chất và linh hoạt để khuyến khích, bảo vệ và tạo điều kiện cho đội ngũ cán bộ, đảng viên phát huy tinh thần đổi mới, sáng tạo."}, {"label": "c", "text": "Xây dựng cơ chế, chính sách bảo vệ cán bộ, đảng viên trong quá trình thực hiện các sáng kiến đổi mới."}, {"label": "d", "text": "Xây dựng các chính sách hỗ trợ thực chất về nguồn lực, bao gồm tài chính, nhân lực, và thời gian để bảo đảm các sáng kiến đổi mới có đủ điều kiện để được triển khai."}], "answer": "a.", "correct": ["a"]}, {"id": 243, "section": "VII. NỘI DUNG THỰC HIỆN CHUẨN MỰC ĐẠO ĐỨC CÁCH MẠNG CỦA CÁN BỘ, ĐẢNG VIÊN (09 CÂU)", "qnum": 1, "question": "Theo tư tưởng Hồ Chí Minh, một trong những biểu hiện của đạo đức cách mạng là gì ?", "options": [{"label": "a", "text": "Trung với nước, hiếu với dân."}, {"label": "b", "text": "Trung với vua, hiếu với cha mẹ."}, {"label": "c", "text": "Trung quân, ái quốc."}, {"label": "d", "text": "Quân xử thần tử."}], "answer": "a.", "correct": ["a"]}, {"id": 244, "section": "VII. NỘI DUNG THỰC HIỆN CHUẨN MỰC ĐẠO ĐỨC CÁCH MẠNG CỦA CÁN BỘ, ĐẢNG VIÊN (09 CÂU)", "qnum": 2, "question": "Nội dung đầy đủ nhất một trong những chuẩn mực đạo đức cách mạng của cán bộ, đảng viên trong giai đoạn mới là gì ?", "options": [{"label": "a", "text": "Nêu cao tinh thần yêu nước, lòng tự hào dân tộc."}, {"label": "b", "text": "Tạo điều kiện để Nhân dân phát huy quyền làm chủ, dựa vào Nhân dân để xây dựng Đảng và hệ thống chính trị trong sạch, vững mạnh."}, {"label": "c", "text": "Yêu nước, tôn trọng Nhân dân, tuyệt đối trung thành với Đảng, với Tổ quốc."}, {"label": "d", "text": "Kiên quyết, kiên trì đấu tranh với mọi hành vi gây phương hại đến lợi ích quốc gia - dân tộc."}], "answer": "c.", "correct": ["c"]}, {"id": 245, "section": "VII. NỘI DUNG THỰC HIỆN CHUẨN MỰC ĐẠO ĐỨC CÁCH MẠNG CỦA CÁN BỘ, ĐẢNG VIÊN (09 CÂU)", "qnum": 3, "question": "Nội dung đầy đủ nhất một trong những chuẩn mực đạo đức cách mạng của cán bộ, đảng viên trong giai đoạn mới là gì ?", "options": [{"label": "a", "text": "Bản lĩnh, đổi mới, sáng tạo, hội nhập."}, {"label": "b", "text": "Thực hiện nghiêm Cương lĩnh chính trị, Điều lệ Đảng."}, {"label": "c", "text": "Cống hiến cho sự nghiệp xây dựng và bảo vệ Tổ quốc, góp phần phát triển đất nước, địa phương, cơ quan, đơn vị."}, {"label": "d", "text": "Chủ động nâng cao kiến thức, kỹ năng; năng lực công tác, làm việc trong môi trường quốc tế."}], "answer": "a.", "correct": ["a"]}, {"id": 246, "section": "VII. NỘI DUNG THỰC HIỆN CHUẨN MỰC ĐẠO ĐỨC CÁCH MẠNG CỦA CÁN BỘ, ĐẢNG VIÊN (09 CÂU)", "qnum": 4, "question": "Nội dung đầy đủ nhất một trong những chuẩn mực đạo đức cách mạng của cán bộ, đảng viên trong giai đoạn mới là gì ?", "options": [{"label": "a", "text": "Tâm huyết, trách nhiệm, dấn thân, nỗ lực hoàn thành tốt nhất nhiệm vụ được giao."}, {"label": "b", "text": "Cần, kiệm, liêm, chính, chí công vô tư."}, {"label": "c", "text": "Quản lý, sử dụng tài sản công đúng mục đích, đúng quy định."}, {"label": "d", "text": "Chủ động phòng ngừa, đấu tranh ngăn chặn tham nhũng, tiêu cực, suy thoái về tư tưởng, chính trị, đạo đức, lối sống, chủ nghĩa cá nhân, lợi ích nhóm, những biểu hiện \"tự diễn biến\", \"tự chuyển hoá\" trong nội bộ."}], "answer": "b.", "correct": ["b"]}, {"id": 247, "section": "VII. NỘI DUNG THỰC HIỆN CHUẨN MỰC ĐẠO ĐỨC CÁCH MẠNG CỦA CÁN BỘ, ĐẢNG VIÊN (09 CÂU)", "qnum": 5, "question": "Nội dung đầy đủ nhất một trong những chuẩn mực đạo đức cách mạng của cán bộ, đảng viên trong giai đoạn mới là gì ?", "options": [{"label": "a", "text": "Luôn luôn giữ gìn sự đoàn kết, thống nhất trong Đảng, cơ quan, tổ chức và trong Nhân dân."}, {"label": "b", "text": "Nêu cao ý thức tổ chức kỷ luật, kỷ cương, nhất là kỷ luật phát ngôn."}, {"label": "c", "text": "Sống có nghĩa tình, chân thành, thương yêu, đối xử, giúp đỡ đồng chí, đồng nghiệp."}, {"label": "d", "text": "Đoàn kết, kỷ cương, tình thương, trách nhiệm."}], "answer": "d.", "correct": ["d"]}, {"id": 248, "section": "VII. NỘI DUNG THỰC HIỆN CHUẨN MỰC ĐẠO ĐỨC CÁCH MẠNG CỦA CÁN BỘ, ĐẢNG VIÊN (09 CÂU)", "qnum": 6, "question": "Nội dung đầy đủ nhất một trong những chuẩn mực đạo đức cách mạng của cán bộ, đảng viên trong giai đoạn mới là gì ?", "options": [{"label": "a", "text": "Gương mẫu, khiêm tốn, tu dưỡng rèn luyện, học tập suốt đời."}, {"label": "b", "text": "Gương mẫu trong công tác và sinh hoạt, tích cực học tập."}, {"label": "c", "text": "Cấp trên gương mẫu trước cấp dưới, cấp ủy gương mẫu trước đảng viên, đảng viên gương mẫu trước quần chúng."}, {"label": "d", "text": "Không ngừng học tập, tu dưỡng, rèn luyện, nâng cao phẩm chất, đạo đức, trình độ, năng lực công tác."}], "answer": "a.", "correct": ["a"]}, {"id": 249, "section": "VII. NỘI DUNG THỰC HIỆN CHUẨN MỰC ĐẠO ĐỨC CÁCH MẠNG CỦA CÁN BỘ, ĐẢNG VIÊN (09 CÂU)", "qnum": 7, "question": "Một trong những yêu cầu đẩy mạnh học tập và làm theo tư tưởng Hồ Chí Minh về thực hiện chuẩn mực đạo đức cách mạng của cán bộ, đảng viên trong quân đội hiện nay là gì ?", "options": [{"label": "a", "text": "Quán triệt sâu sắc quan điểm của Đảng, của Quân ủy Trung ương về công tác xây dựng, chỉnh đốn Đảng, phát huy phẩm chất “Bộ đội Cụ Hồ”, kiên quyết đấu tranh chống chủ nghĩa cá nhân trong tình hình mới."}, {"label": "b", "text": "Tăng cường quán triệt sâu sắc quan điểm của Chủ tịch Hồ Chí Minh, đường lối, chủ trương, quan điểm của Đảng, pháp luật Nhà nước làm cho cán bộ, đảng viên."}, {"label": "c", "text": "Làm cho cán bộ, đảng viên nhận thức sâu sắc vị trí, vai trò, tầm quan trọng của đạo đức cách mạng đối với công tác giáo dục rèn luyện cán bộ, đảng viên đối với công tác xây dựng, chỉnh đốn Đảng."}, {"label": "d", "text": "Làm cho cán bộ, đảng viên nhận thức sâu sắc vị trí, vai trò, tầm quan trọng của đạo đức cách mạng đối với việc xây dựng quân đội cách mạng, chính quy, tinh nhuệ, hiện đại."}], "answer": "a.", "correct": ["a"]}, {"id": 250, "section": "VII. NỘI DUNG THỰC HIỆN CHUẨN MỰC ĐẠO ĐỨC CÁCH MẠNG CỦA CÁN BỘ, ĐẢNG VIÊN (09 CÂU)", "qnum": 8, "question": "Một trong những yêu cầu đẩy mạnh học tập và làm theo tư tưởng Hồ Chí Minh về thực hiện chuẩn mực đạo đức cách mạng của cán bộ, đảng viên trong quân đội hiện nay là gì ?", "options": [{"label": "a", "text": "Thực hiện nghiêm túc và duy trì có nền nếp, chế độ tự phê bình và phê bình, “tự soi, tự sửa” theo nghị quyết, chỉ thị, kết luận, quy định của Đảng."}, {"label": "b", "text": "Phát huy tinh thần tích cực, tự giác tu dưỡng, rèn luyện của đội ngũ cán bộ, đảng viên về thực hiện chuẩn mực đạo đức cách mạng đáp ứng yêu cầu nhiệm vụ trong tình hình mới."}, {"label": "c", "text": "Thực hiện nghiêm túc quy định những điều đảng viên không được làm, quy định chuẩn mực đạo đức cách mạng của cán bộ, đảng viên."}, {"label": "d", "text": "Luôn đặt ra yêu cầu cao cho mình, xây dựng, bồi đắp ý chí, quyết tâm, động cơ phấn đấu vươn lên, vượt qua mọi khó khăn, thử thách, cám dỗ về vật chất, tiền tài, địa vị, danh vọng, có sức đề kháng với tệ nạn xã hội."}], "answer": "b.", "correct": ["b"]}, {"id": 251, "section": "VII. NỘI DUNG THỰC HIỆN CHUẨN MỰC ĐẠO ĐỨC CÁCH MẠNG CỦA CÁN BỘ, ĐẢNG VIÊN (09 CÂU)", "qnum": 9, "question": "Một trong những yêu cầu đẩy mạnh học tập và làm theo tư tưởng Hồ Chí Minh về thực hiện chuẩn mực đạo đức cách mạng của cán bộ, đảng viên trong quân đội hiện nay là gì ?", "options": [{"label": "a", "text": "Đề cao trách nhiệm của chính ủy, chính trị viên, người chỉ huy các cấp trong lãnh đạo, chỉ đạo, triển khai và tổ chức thực hiện chuẩn mực đạo đức cách mạng của cán bộ, đảng viên."}, {"label": "b", "text": "Cơ quan chính trị, cán bộ chính trị, nắm vững tình hình tư tưởng, kỷ luật của cán bộ, đảng viên, tăng cường tham mưu lãnh đạo, chỉ đạo, hướng dẫn triển khai thực hiện quy định đạo đức cách mạng."}, {"label": "c", "text": "Phát huy sức mạnh tổng hợp của các tổ chức, lực lượng trong cơ quan, đơn vị vào thực hiện chuẩn mực đạo đức cách mạng của cán bộ, đảng viên trong quân đội hiện nay."}, {"label": "d", "text": "Phát huy hiệu quả hoạt động của Hội đồng quân nhân và các tổ chức quần chúng trong cơ quan, đơn vị tích cực tham gia góp ý phê bình cấp ủy, tổ chức đảng, cán bộ, đảng viên."}], "answer": "c.", "correct": ["c"]}, {"id": 252, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 1, "question": "Một trong những đặc điểm các dân tộc Việt Nam ?", "options": [{"label": "a", "text": "Đồng bào các dân tộc luôn đoàn kết, nỗ lực phấn đấu xây dựng một nước Việt Nam độc lập, thống nhất, dân giàu, nước mạnh, xã hội dân chủ, công bằng, văn minh."}, {"label": "b", "text": "Đồng bào các dân tộc Việt Nam không có lãnh thổ riêng của tộc người rõ rệt mà được phân bố ở hầu hết các tỉnh, thành phố trong phạm vi cả nước."}, {"label": "c", "text": "Điều kiện sinh hoạt của đồng bào các DTTS còn nhiều khó khăn và có sự chênh lệch về mức sống giữa các dân tộc."}, {"label": "d", "text": "Quá trình hình thành và phát triển các dân tộc gắn liền với lịch sử dựng nước và giữ nước."}], "answer": "b.", "correct": ["b"]}, {"id": 253, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 2, "question": "Một trong những đặc điểm các dân tộc Việt Nam ?", "options": [{"label": "a", "text": "Đồng bào các dân tộc luôn đoàn kết, nỗ lực phấn đấu xây dựng một nước Việt Nam độc lập, thống nhất, dân giàu, nước mạnh, xã hội dân chủ, công bằng, văn minh."}, {"label": "b", "text": "Điều kiện sinh hoạt của đồng bào các DTTS còn nhiều khó khăn và có sự chênh lệch về mức sống giữa các dân tộc."}, {"label": "c", "text": "Bản chất của đồng bào các DTTS là thật thà, chất phác, trọng tình nghĩa, có ý thức tộc người, đặc biệt là ý thức dòng họ rất sâu sắc, làm đậm thêm ý thức về quốc gia - dân tộc."}, {"label": "d", "text": "Quá trình hình thành và phát triển các dân tộc gắn liền với lịch sử dựng nước và giữ nước."}], "answer": "c.", "correct": ["c"]}, {"id": 254, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 3, "question": "Một trong những đặc điểm các dân tộc Việt Nam ?", "options": [{"label": "a", "text": "Đồng bào các dân tộc luôn đoàn kết, nỗ lực phấn đấu xây dựng một nước Việt Nam độc lập, thống nhất, dân giàu, nước mạnh, xã hội dân chủ, công bằng, văn minh."}, {"label": "b", "text": "Điều kiện sinh hoạt của đồng bào các DTTS còn nhiều khó khăn và có sự chênh lệch về mức sống giữa các dân tộc."}, {"label": "c", "text": "Quá trình hình thành và phát triển các dân tộc gắn liền với lịch sử dựng nước và giữ nước."}, {"label": "d", "text": "Mỗi DTTS đều có những nét văn hoá đặc trưng riêng, góp phần tạo nên nền văn hoá Việt Nam phong phú, đa dạng, thống nhất, đậm đà bản sắc dân tộc."}], "answer": "d.", "correct": ["d"]}, {"id": 255, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 4, "question": "Một trong những đặc điểm các dân tộc Việt Nam ?", "options": [{"label": "a", "text": "Đồng bào các dân tộc luôn đoàn kết, nỗ lực phấn đấu xây dựng một nước Việt Nam độc lập, thống nhất, dân giàu, nước mạnh, xã hội dân chủ, công bằng, văn minh."}, {"label": "b", "text": "Tình trạng phân hóa giàu nghèo, phân tầng xã hội trong đồng bào các dân tộc ngày càng lớn."}, {"label": "c", "text": "Điều kiện sinh hoạt của đồng bào các DTTS còn nhiều khó khăn và có sự chênh lệch về mức sống giữa các dân tộc."}, {"label": "d", "text": "Quá trình hình thành và phát triển các dân tộc gắn liền với lịch sử dựng nước và giữ nước."}], "answer": "b.", "correct": ["b"]}, {"id": 256, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 5, "question": "Một trong những quan điểm, chính sách của Đảng, Nhà nước Việt Nam về dân tộc ?", "options": [{"label": "a", "text": "Vấn đề dân tộc và đoàn kết dân tộc là vấn đề chiến lược cơ bản, lâu dài, đồng thời cũng là vấn đề cấp bách hiện nay của cách mạng Việt Nam."}, {"label": "b", "text": "Vấn đề dân tộc là nhiệm vụ có tính chiến lược nhằm phát huy sức mạnh tổng hợp khối đại đoàn kết toàn dân tộc."}, {"label": "c", "text": "Chú trọng tính đặc thù của từng vùng đồng bào DTTS trong hoạch định và thực hiện các chính sách về dân tộc."}, {"label": "d", "text": "Tổ chức thực hiện các chính sách về dân tộc, tạo điều kiện cho đồng bào các dân tộc được tiếp cận bình đẳng nguồn lực, cơ hội phát triển và hưởng thụ công bằng các dịch vụ xã hội cơ bản."}], "answer": "a.", "correct": ["a"]}, {"id": 257, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 1, "question": "Theo Điều 12, Thông tư số 122/2024/TT-BQP, ngày 31/12/2024 của Bộ Quốc phòng Quy định về thực hiện dân chủ ở cơ sở trong QĐND Việt Nam, trường hợp cơ quan, đơn vị đã có trang thông tin điện tử nội bộ hoặc hệ thống thông tin điện tử nội bộ, việc đăng tải các thông tin được quy định như thế nào ?", "options": [{"label": "a", "text": "Ít nhất là 15 ngày liên tục kể từ ngày bắt đầu đăng tin, trừ trường hợp pháp luật có quy định khác."}, {"label": "b", "text": "Ít nhất là 20 ngày liên tục kể từ ngày bắt đầu đăng tin, trừ trường hợp pháp luật có quy định khác."}, {"label": "c", "text": "Ít nhất là 10 ngày liên tục kể từ ngày bắt đầu đăng tin, trừ trường hợp pháp luật có quy định khác."}, {"label": "d", "text": "Cho đến khi thông tin hết hiệu lực."}], "answer": "b.", "correct": ["b"]}, {"id": 258, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 2, "question": "Theo Điều 12, Thông tư số 122/2024/TT-BQP, ngày 31/12/2024 của Bộ Quốc phòng Quy định về thực hiện dân chủ ở cơ sở trong QĐND Việt Nam, trường hợp cơ quan, đơn vị chưa có trang thông tin điện tử nội bộ hoặc hệ thống thông tin điện tử nội bộ, việc niêm yết các thông tin được quy định như thế nào ?", "options": [{"label": "a", "text": "Ít nhất là 15 ngày liên tục tính từ ngày niêm yết, trừ trường hợp đã thông báo bằng văn bản đến toàn thể quân nhân, công nhân, viên chức quốc phòng, người lao động thuộc quyền."}, {"label": "a", "text": "Ít nhất là 15 ngày liên tục tính từ ngày niêm yết."}, {"label": "c", "text": "Ít nhất là 20 ngày liên tục tính từ ngày niêm yết."}, {"label": "d", "text": "Ít nhất là 20 ngày liên tục tính từ ngày niêm yết, trừ trường hợp đã thông báo bằng văn bản đến toàn thể quân nhân, công nhân, viên chức quốc phòng, người lao động thuộc quyền."}], "answer": "d.", "correct": ["d"]}, {"id": 259, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 3, "question": "Theo Điều 15, Thông tư số 122/2024/TT-BQP, ngày 31/12/2024 của Bộ Quốc phòng Quy định về thực hiện dân chủ ở cơ sở trong QĐND Việt Nam, Hội nghị tập thể quân nhân được tổ chức hợp lệ khi nào ?", "options": [{"label": "a", "text": "Có ít nhất một phần hai tổng số quân nhân, công nhân, viên chức quốc phòng, người lao động hoặc ít nhất hai phần ba tổng số đại biểu được triệu tập có mặt."}, {"label": "b", "text": "Có ít nhất hai phần ba tổng số quân nhân, công nhân, viên chức quốc phòng, người lao động hoặc ít nhất hai phần ba tổng số đại biểu được triệu tập có mặt."}, {"label": "c", "text": "Có 100% quân nhân, công nhân, viên chức quốc phòng, người lao động hoặc ít nhất hai phần ba tổng số đại biểu được triệu tập có mặt."}, {"label": "d", "text": "Có ít nhất một phần hai tổng số quân nhân, công nhân, viên chức quốc phòng, người lao động hoặc 100% đại biểu được triệu tập có mặt."}], "answer": "b.", "correct": ["b"]}, {"id": 260, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 4, "question": "Theo Điều 15, Thông tư số 122/2024/TT-BQP, ngày 31/12/2024 của Bộ Quốc phòng Quy định về thực hiện dân chủ ở cơ sở trong QĐND Việt Nam, Quyết định của hội nghị được thông qua khi nào ?", "options": [{"label": "a", "text": "Có trên 75% tổng số thành viên dự hội nghị tán thành và nội dung không trái với quy định của pháp luật, Bộ Quốc phòng và cơ quan, đơn vị."}, {"label": "b", "text": "Có trên 75% tổng số thành viên dự hội nghị tán thành."}, {"label": "c", "text": "Có trên 50% tổng số thành viên dự hội nghị tán thành và nội dung không trái với quy định của pháp luật, Bộ Quốc phòng và cơ quan, đơn vị."}, {"label": "d", "text": "Có trên 50% tổng số thành viên dự hội nghị tán thành."}], "answer": "c.", "correct": ["c"]}, {"id": 261, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 5, "question": "Theo Điều 24, Thông tư số 122/2024/TT-BQP, ngày 31/12/2024 của Bộ Quốc phòng Quy định về thực hiện dân chủ ở cơ sở trong QĐND Việt Nam, thời gian cấp cơ sở tổ chức sinh hoạt đối thoại dân chủ được quy định như thế nào ?", "options": [{"label": "a", "text": "Mỗi tháng 1 lần."}, {"label": "b", "text": "Tuỳ theo tình hình đơn vị."}, {"label": "c", "text": "Do người chỉ huy quy định."}, {"label": "d", "text": "Mỗi quý 1 lần."}], "answer": "a.", "correct": ["a"]}, {"id": 262, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 1, "question": "Cấu trúc của đạo đức bao gồm:", "options": [{"label": "a", "text": "Ý thức đạo đức, hành vi đạo đức và quan hệ đạo đức."}, {"label": "b", "text": "Ý thức đạo đức và hành vi đạo đức."}, {"label": "c", "text": "Khái niệm đạo đức, ý thức đạo đức và hành vi đạo đức."}, {"label": "a", "text": "Nhận thức đạo đức, hành vi đạo đức và quan hệ đạo đức."}], "answer": "a.", "correct": ["a"]}, {"id": 263, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 2, "question": "Đặc điểm của đạo đức bao gồm:", "options": [{"label": "a", "text": "Tính chuẩn mực, tính tự nguyện và tính thống nhất."}, {"label": "a", "text": "Tính chuẩn mực, tính tự nguyện và tính bền vững."}, {"label": "c", "text": "Tính chuẩn mực, tính tự nguyện và tính phổ quát."}, {"label": "a", "text": "Tính chuẩn mực, tính tự nguyện và tính nhân văn."}], "answer": "c.", "correct": ["c"]}, {"id": 264, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 3, "question": "Vai trò của đạo đức bao là:", "options": [{"label": "a", "text": "Hướng dẫn hành vi, đánh giá hành vi và bồi đắp đạo đức."}, {"label": "b", "text": "Hướng dẫn hành vi, đánh giá hành vi và xây dựng lòng tin."}, {"label": "c", "text": "Hướng dẫn hành vi, đánh giá hành vi và bồi đắp lý tưởng."}, {"label": "d", "text": "Hướng dẫn hành vi, đánh giá hành vi và kết luận hành vi."}], "answer": "b.", "correct": ["b"]}, {"id": 265, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 4, "question": "Theo quan điểm của Hồ Chí Minh về đạo đức cách mạng, những biểu hiện cụ thể về chuẩn mực đạo đức cách mạng của cán bộ, đảng viên là gì ?", "options": [{"label": "a", "text": "Tận trung với Đảng, tận hiếu với dân."}, {"label": "b", "text": "Yêu thương con người."}, {"label": "c", "text": "Cần, kiệm, liêm, chính, chí công vô tư."}, {"label": "d", "text": "Tinh thần quốc tế trong sáng, hội nhập quốc tế."}], "answer": "Tất cả phương án trên.", "correct": []}, {"id": 266, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 5, "question": "Nghị quyết số 847-NQ/QUTW ngày 28/12/2021 của Quân ủy Trung ương là về vấn đề gì ?", "options": [{"label": "a", "text": "Về phát huy phẩm chất “Bộ đội Cụ Hồ”, kiên quyết chống chủ nghĩa cá nhân trong tình hình mới."}, {"label": "b", "text": "Tiếp tục giữ vững phẩm chất cao đẹp, danh hiệu cao quý \"Bộ đội Cụ Hồ\", kiên quyết đấu tranh ngăn chặn, đẩy lùi những biểu hiện chủ nghĩa cá nhân."}, {"label": "c", "text": "Xây dựng đội ngũ cán bộ các cấp mẫu mực, trách nhiệm, làm việc hiệu quả."}, {"label": "d", "text": "Tập trung xây dựng đội ngũ cán bộ các cấp, nhất là cán bộ cấp chiến lược đủ phẩm chất, năng lực và uy tín, ngang tầm nhiệm vụ"}], "answer": "a.", "correct": ["a"]}, {"id": 267, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 6, "question": "Một trong những giải pháp nâng cao trách nhiệm trong công tác của cán bộ chủ trì và đội ngũ cán bộ các cấp theo tư tưởng Hồ Chí Minh ở các cơ quan, đơn vị Bộ Tham mưu trong thời gian tới là ?", "options": [{"label": "a", "text": "Quan tâm, chăm lo xây dựng đội ngũ cán bộ vững mạnh, hoàn thành tốt chức trách, nhiệm vụ, góp phần thực hiện thắng lợi nhiệm vụ chính trị trung tâm của đơn vị."}, {"label": "b", "text": "Nâng cao vai trò của cấp ủy, chỉ huy đơn vị trong công tác giáo dục, rèn luyện đạo đức và xác định trách nhiệm của đội ngũ cán bộ trong thực hiện nhiệm vụ theo tư tưởng Hồ Chí Minh."}, {"label": "c", "text": "Thường xuyên kiểm tra, đôn đốc, chấn chỉnh nhắc nhỡ cán bộ kịp thời, đúng lúc, đúng việc, không dồn khuyết điểm, không thiên vị cá nhân."}, {"label": "d", "text": "Quán triệt sâu sắc tư tưởng Hồ Chí Minh trong công tác quản lý, giáo dục, rèn luyện và sử dụng cán bộ."}], "answer": "b.", "correct": ["b"]}, {"id": 268, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 7, "question": "Một trong những giải pháp nâng cao trách nhiệm trong công tác của cán bộ chủ trì và đội ngũ cán bộ các cấp theo tư tưởng Hồ Chí Minh ở các cơ quan, đơn vị Bộ Tham mưu trong thời gian tới là ?", "options": [{"label": "a", "text": "Đẩy mạnh học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh xây dựng đạo đức, nâng cao trách nhiệm vụ trong công tác cho đội ngũ cán bộ các cấp."}, {"label": "b", "text": "Luôn thực hành đạo đức, lối sống và chuẩn mực cả về ý thức, hành vi và quan hệ đạo đức, đảm bảo giữ vững được cốt cách của một cán bộ luôn gương mẫu."}, {"label": "c", "text": "Tuân thủ nghiêm ngặt nguyên tắc tập trung dân chủ, tập thể lãnh đạo, cá nhân phụ trách, biết lắng nghe ý kiến của mọi người, đưa ra quyết định phù hợp với nguyện vọng và nhiệm vụ của cơ quan, đơn vị."}, {"label": "d", "text": "Thường xuyên rèn luyện tác phong, cách ứng xử phải khiêm tốn, nhã nhặn, lịch thiệp, luôn hòa nhã với tập thể, không tự cao, tự đại, dựa vào chức quyền, cương vị."}], "answer": "a.", "correct": ["a"]}, {"id": 269, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 8, "question": "Một trong những giải pháp nâng cao trách nhiệm trong công tác của cán bộ chủ trì và đội ngũ cán bộ các cấp theo tư tưởng Hồ Chí Minh ở các cơ quan, đơn vị Bộ Tham mưu trong thời gian tới là ?", "options": [{"label": "a", "text": "Trang bị kiến thức toàn diện và nâng cao giác ngộ lý luận Chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh và quan điểm, đường lối, chủ trương của Đảng, chính sách pháp luật của Nhà nước cho đội ngũ cán bộ các cấp"}, {"label": "b", "text": "Làm tốt công tác tuyên truyền để mọi người nhận thức đầy đủ ý nghĩa, tầm quan trọng về mục tiêu lý tưởng của Đảng, nhiệm vụ của Quân đội, đơn vị."}, {"label": "c", "text": "Thường xuyên bồi dưỡng nâng cao trình độ lý luận, nhận thức cho cán bộ các cấp chống suy thoái tư tưởng chính trị, đạo đức, lối sống, nhất là các biểu hiện \"tự diễn biến\", \"tự chuyển hóa\" trong nội bộ"}, {"label": "d", "text": "Giáo dục cho cán bộ nhận thức đúng đắn và có niềm tin tuyệt đối vào sự lãnh đạo của Đảng và sự nghiệp đổi mới đất nước ta hiện nay."}], "answer": "c.", "correct": ["c"]}, {"id": 270, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 9, "question": "Một trong những giải pháp nâng cao trách nhiệm trong công tác của cán bộ chủ trì và đội ngũ cán bộ các cấp theo tư tưởng Hồ Chí Minh ở các cơ quan, đơn vị Bộ Tham mưu trong thời gian tới là ?", "options": [{"label": "a", "text": "Phát tinh thần tự học tập, tu dưỡng, rèn luyện phẩm chất đạo đức  của cán bộ có chí tiến thủ, khiêm tốn, nâng cao trách nhiệm hoàn thành tốt nhiệm vụ được giao."}, {"label": "b", "text": "Xây dựng cho đội ngũ cán bộ các cấp có lập trường tư tưởng, chính trị vững vàng, yên tâm công tác, tin tưởng tuyệt đối vào sự lãnh đạo của Đảng, sự thắng lợi của công cuộc đổi mới đất nước, kỷ nguyên vươn mình của dân tộc."}, {"label": "c", "text": "Luôn phát huy và giữ vững truyền thống, đạo đức cách mạng, phẩm chất \"Bộ đội Cụ Hồ\"; có lối sống trong sạch, giản dị, lành mạnh; có ý thức tổ chức, kỷ luật, tác phong dân chủ."}, {"label": "d", "text": "Nhận thức đầy đủ và sâu sắc về ý nghĩa, mục đích việc thực hiện chức trách, nhiệm vụ được phân công; hiểu rõ vai trò, trách nhiệm, quyền hạn của bản thân và các mối quan hệ công tác."}], "answer": "a.", "correct": ["a"]}, {"id": 271, "section": "VIII. NỘI DUNG DÂN TỘC, TÔN GIÁO Ở VIỆT NAM (05 CÂU)", "qnum": 10, "question": "Một trong những giải pháp nâng cao trách nhiệm trong công tác của cán bộ chủ trì và đội ngũ cán bộ các cấp theo tư tưởng Hồ Chí Minh ở các cơ quan, đơn vị Bộ Tham mưu trong thời gian tới là ?", "options": [{"label": "a", "text": "Nhận xét, đánh giá đúng về cán bộ, để cán bộ có niềm tin và hướng phấn đấu, dám nghĩ, dám làm và dám chịu trách nhiệm trước công việc, có khát vọng vươn lên."}, {"label": "b", "text": "Khen thưởng cán bộ phải bảm đảm đúng người, đúng việc, dân chủ, khách quan, công khai, công bằng, không áp đặt ý kiến chủ quan."}, {"label": "c", "text": "Thường xuyên kiểm tra, giám sát việc \"tự soi, tự sửa\", tự học, tự rèn của cán bộ để có biện pháp chấn chỉnh kịp thời, giúp cho cán bộ luôn có ý thức tu dưỡng, rèn luyện."}, {"label": "d", "text": "Đổi mới phương pháp nhận xét, đánh giá, khen thưởng và tăng cường công tác kiểm tra, giám sát việc \"tự soi, tự sửa\", tự học, tự rèn đối với cán bộ."}], "answer": "d.", "correct": ["d"]}, {"id": 272, "section": "XI. NỘI DUNG NÂNG CAO CHẤT LƯỢNG GIÁO DỤC TRUYỀN THỐNG (05 CÂU)", "qnum": 1, "question": "Theo Chủ tịch Hồ Chí Minh, lý do quan trọng nhất phải “biết sử ta” là gì?", "options": [{"label": "a", "text": "Để so sánh với lịch sử các nước khác."}, {"label": "b", "text": "Để lưu giữ những di sản vật chất quý báu."}, {"label": "c", "text": "Vì lịch sử, truyền thống chính là sức mạnh tiềm ẩn, là “hồn thiêng sông núi”."}, {"label": "d", "text": "Vì lịch sử giúp nâng cao trình độ học vấn."}], "answer": "c.", "correct": ["c"]}, {"id": 273, "section": "XI. NỘI DUNG NÂNG CAO CHẤT LƯỢNG GIÁO DỤC TRUYỀN THỐNG (05 CÂU)", "qnum": 2, "question": "Khái niệm truyền thống theo Từ điển Tiếng Việt nhấn mạnh yếu tố nào?", "options": [{"label": "a", "text": "Niềm tin và hành động có giá trị."}, {"label": "b", "text": "Đức tính, tập quán, tư tưởng, lối sống được truyền từ thế hệ này sang thế hệ khác."}, {"label": "c", "text": "Những sự kiện lịch sử đã diễn ra trong quá khứ."}, {"label": "d", "text": "Các giá trị vật chất được lưu giữ."}, {"label": "b", "text": "Truyền thống chỉ là những yếu tố được lưu truyền, chi phối hành vi, chứ không phải tất cả sự kiện lịch sử."}, {"label": "c", "text": "Lịch sử thay đổi, còn truyền thống thì bất biến."}, {"label": "d", "text": "Truyền thống thiên về vật chất, lịch sử thiên về tinh thần"}], "answer": "b.", "correct": ["b"]}, {"id": 274, "section": "XI. NỘI DUNG NÂNG CAO CHẤT LƯỢNG GIÁO DỤC TRUYỀN THỐNG (05 CÂU)", "qnum": 4, "question": "Giáo dục truyền thống trong quân đội được hiểu là gì?", "options": [{"label": "a", "text": "Hoạt động của các tổ chức quần chúng nhằm bồi dưỡng văn hóa đọc."}, {"label": "b", "text": "Quá trình tác động có mục đích, hệ thống, liên tục nhằm trang bị giá trị lịch sử - truyền thống, hình thành niềm tin, lý tưởng cách mạng."}, {"label": "c", "text": "Quá trình tự học tập, tự nghiên cứu của cán bộ, chiến sĩ."}, {"label": "d", "text": "Việc tổ chức tham quan bảo tàng, di tích lịch sử."}], "answer": "b.", "correct": ["b"]}, {"id": 275, "section": "XI. NỘI DUNG NÂNG CAO CHẤT LƯỢNG GIÁO DỤC TRUYỀN THỐNG (05 CÂU)", "qnum": 5, "question": "Nội dung trọng tâm của giáo dục truyền thống lịch sử trong quân đội là gì?", "options": [{"label": "a", "text": "Tuyên truyền về các phong tục địa phương."}, {"label": "b", "text": "Tập trung vào chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh, đường lối của Đảng và lịch sử đấu tranh dựng nước, giữ nước."}, {"label": "c", "text": "Nâng cao kỹ năng quân sự hiện đại."}, {"label": "d", "text": "Tổ chức hội diễn văn nghệ quần chúng."}], "answer": "b.", "correct": ["b"]}, {"id": 276, "section": "XII. NỘI DUNG TƯ TƯỞNG HỒ CHÍ MINH VỀ TỰ PHÊ BÌNH VÀ PHÊ BÌNH (05 CÂU)", "qnum": 1, "question": "Theo Tư tưởng Hồ Chí Minh mục đích của tự phê bình và phê bình là gì?", "options": [{"label": "a", "text": "Mục đích của tự phê bình và phê bình là giúp con người và tổ chức vươn tới sự hoàn thiện, hoàn mỹ chứ không phải để nói xấu nhau."}, {"label": "b", "text": "Mục đích của tự phê bình và phê bình là xây dựng, là giúp con người và tổ chức vươn tới sự hoàn thiện, hoàn mỹ chứ không phải để nói xấu nhau."}, {"label": "c", "text": "Mục đích của tự phê bình và phê bình là chỉ ra khuyết điểm của mình và chỉ trích khuyết điểm của người khác."}, {"label": "d", "text": "Mục đích của tự phê bình và phê bình là hạ thấp bản thân mình và trùi dập người khác."}], "answer": "b.", "correct": ["b"]}, {"id": 277, "section": "XII. NỘI DUNG TƯ TƯỞNG HỒ CHÍ MINH VỀ TỰ PHÊ BÌNH VÀ PHÊ BÌNH (05 CÂU)", "qnum": 2, "question": "Một trong những phương pháp tự phê bình và phê bình thể hiện không chỉ đúng mà còn khéo theo Tư tưởng Hồ Chí Minh", "options": [{"label": "a", "text": "Tự phê bình mình trước rồi mới phê bình người khác."}, {"label": "b", "text": "Gặp gỡ riêng để phê bình."}, {"label": "c", "text": "Phê bình việc, chứ không phê bình người."}, {"label": "d", "text": "Tổ chức hội nghị toàn thể cơ quan, đơn vị để phê bình."}], "answer": "c.", "correct": ["c"]}, {"id": 278, "section": "XII. NỘI DUNG TƯ TƯỞNG HỒ CHÍ MINH VỀ TỰ PHÊ BÌNH VÀ PHÊ BÌNH (05 CÂU)", "qnum": 3, "question": "Một trong những yêu cầu đẩy mạnh học tập và làm theo tư tưởng Hồ Chí Minh về thực hành dân chủ và kỷ luật trong Quân đội nhân dân Việt Nam hiện nay?", "options": [{"label": "a", "text": "Tăng cường nghiên cứu, học tập, quán triệt sâu sắc, nắm vững quan điểm của Đảng, tư tưởng Hồ Chí Minh về tự phê bình và phê bình."}, {"label": "b", "text": "Thường xuyên đổi mới nội dung, hình thức, phương pháp tự phê bình và phê bình trong Quân đội nhân dân Việt Nam hiện nay."}, {"label": "c", "text": "Tiến hành thường xuyên, liên tục, thiết thực, hiệu quả việc đẩy mạnh học tập và làm theo tư tưởng Hồ Chí Minh về tự phê bình và phê bình trong Quân đội nhân dân Việt Nam hiện nay."}, {"label": "d", "text": "Cả 3 đáp án đều đúng ."}], "answer": "d.", "correct": ["d"]}, {"id": 279, "section": "XII. NỘI DUNG TƯ TƯỞNG HỒ CHÍ MINH VỀ TỰ PHÊ BÌNH VÀ PHÊ BÌNH (05 CÂU)", "qnum": 4, "question": "Một trong những yêu cầu đẩy mạnh học tập và làm theo tư tưởng Hồ Chí Minh về thực hành dân chủ và kỷ luật trong Quân đội nhân dân Việt Nam hiện nay?", "options": [{"label": "a", "text": "Lấy “xây” là chính trong đẩy mạnh học tập và làm theo tư tưởng Hồ Chí Minh về tự phê bình và phê bình trong Quân đội nhân dân Việt Nam hiện nay."}, {"label": "b", "text": "Lấy “chống” là chủ yếu trong đẩy mạnh học tập và làm theo tư tưởng Hồ Chí Minh về tự phê bình và phê bình trong Quân đội nhân dân Việt Nam hiện nay."}, {"label": "c", "text": "Kết hợp chặt chẽ giữa “xây” và “chống”, lấy “xây” là chính trong đẩy mạnh học tập và làm theo tư tưởng Hồ Chí Minh về tự phê bình và phê bình trong Quân đội nhân dân Việt Nam hiện nay."}, {"label": "d", "text": "Kết hợp chặt chẽ giữa “xây” và “chống”, lấy “xây” là chính, lấy “chống” làm mục tiêu."}], "answer": "c.", "correct": ["c"]}, {"id": 280, "section": "XII. NỘI DUNG TƯ TƯỞNG HỒ CHÍ MINH VỀ TỰ PHÊ BÌNH VÀ PHÊ BÌNH (05 CÂU)", "qnum": 5, "question": "Giải pháp đẩy mạnh học tập và làm theo tư tưởng Hồ Chí Minh về tự phê bình và phê bình trong Quân đội nhân dân Việt Nam hiện nay?", "options": [{"label": "a", "text": "Tăng cường sự lãnh đạo, chỉ đạo của cấp ủy, tổ chức đảng, chính ủy, chính trị viên, người chỉ huy và cơ quan chính trị các cấp."}, {"label": "b", "text": "Thường xuyên tuyên truyền, giáo dục nâng cao nhận thức, trách nhiệm cho cán bộ, chiến sĩ."}, {"label": "c", "text": "Phát huy vai trò trách nhiệm của các tổ chức, các lực lượng."}, {"label": "d", "text": "Cả 3 đáp án đều đúng."}], "answer": "c.", "correct": ["c"]}, {"id": 281, "section": "XIII. NỘI DUNG XÂY DỰNG ĐẢNG (10 CÂU)", "qnum": 1, "question": "Quy định số 294-QĐ/TW ngày 26/5/2025 của Ban Chấp hành Trung ương khóa XIII nói về vấn đề gì ?", "options": [{"label": "a", "text": "Tiêu chuẩn kết nạp Đảng."}, {"label": "b", "text": "Thời gian kết nạp Đảng"}, {"label": "c", "text": "Quy định độ tuổi kết nạp Đảng."}, {"label": "d", "text": "Thi hành Điều lệ Đảng."}], "answer": "d.", "correct": ["d"]}, {"id": 282, "section": "XIII. NỘI DUNG XÂY DỰNG ĐẢNG (10 CÂU)", "qnum": 2, "question": "Theo Quy định số 294-QĐ/TW ngày 26/5/2025 của Ban Chấp hành Trung ương khóa XIII: Đối với hồ sơ đảng viên, điều gì không được phép thực hiện ?", "options": [{"label": "a", "text": "Sao chép để lưu trữ."}, {"label": "b", "text": "Bổ sung thông tin khi có thay đổi."}, {"label": "c", "text": "Tẩy xóa, tự ý sửa chữa."}, {"label": "d", "text": "Tham khảo, khi cần thiết."}], "answer": "c.", "correct": ["c"]}, {"id": 283, "section": "XIII. NỘI DUNG XÂY DỰNG ĐẢNG (10 CÂU)", "qnum": 3, "question": "Theo Quy định số 294-QĐ/TW ngày 26/5/2025 của Ban Chấp hành Trung ương khóa XIII: Đảng viên sử dụng thẻ đảng viên để làm gì trong sinh hoạt đảng và đại hội Đảng các cấp?", "options": [{"label": "a", "text": "Để xác định danh tính."}, {"label": "b", "text": "Để biểu quyết (trừ các trường hợp biểu quyết bằng phiếu kín)."}, {"label": "c", "text": "Để đăng ký tham gia các khóa học chính trị."}, {"label": "d", "text": "Tất cả a, b,c đều đúng."}], "answer": "b.", "correct": ["b"]}, {"id": 284, "section": "XIII. NỘI DUNG XÂY DỰNG ĐẢNG (10 CÂU)", "qnum": 4, "question": "Theo Quy định số 294-QĐ/TW ngày 26/5/2025 của Ban Chấp hành Trung ương khóa XIII: Đối với đảng viên ra nước ngoài công tác, lao động, học tập từ 12 tháng trở lên, cấp ủy nào có trách nhiệm hướng dẫn bổ sung lý lịch khi đảng viên về nước?", "options": [{"label": "a", "text": "Cấp ủy nơi đảng viên đến công tác, học tập ở nước ngoài."}, {"label": "b", "text": "Ban Tổ chức Trung ương."}, {"label": "c", "text": "Cấp ủy quản lý hồ sơ đảng viên."}, {"label": "d", "text": "Đảng ủy Bộ ngoại giao."}], "answer": "c.", "correct": ["c"]}, {"id": 285, "section": "XIII. NỘI DUNG XÂY DỰNG ĐẢNG (10 CÂU)", "qnum": 5, "question": "Theo Quy định số 294-QĐ/TW ngày 26/5/2025 của Ban Chấp hành Trung ương khóa XIII: Đối với đảng viên bỏ sinh hoạt đảng thì bị xử lý như thế nào?", "options": [{"label": "a", "text": "Được xét nối lại sinh hoạt đảng sau khi kiểm điểm."}, {"label": "b", "text": "Không nối lại sinh hoạt đảng và thông báo xóa tên trong danh sách đảng viên."}, {"label": "c", "text": "Được chuyển sinh hoạt đảng sang chi bộ khác."}, {"label": "d", "text": "Xóa tên đảng viên."}], "answer": "d.", "correct": ["d"]}, {"id": 286, "section": "XIII. NỘI DUNG XÂY DỰNG ĐẢNG (10 CÂU)", "qnum": 6, "question": "Theo Quy định số 294-QĐ/TW ngày 26/5/2025 của Ban Chấp hành Trung ương khóa XIII: Thẻ đảng viên được phát cho đối tượng nào?", "options": [{"label": "a", "text": "Đảng viên dự bị."}, {"label": "b", "text": "Cảm tình đảng."}, {"label": "c", "text": "Đảng viên chính thức."}, {"label": "d", "text": "Người hoạt động cách mạng lâu năm."}], "answer": "c.", "correct": ["c"]}, {"id": 287, "section": "XIII. NỘI DUNG XÂY DỰNG ĐẢNG (10 CÂU)", "qnum": 7, "question": "Theo Quy định số 294-QĐ/TW ngày 26/5/2025 của Ban Chấp hành Trung ương khóa XIII: Hồ sơ đảng viên được coi là tài liệu nào của Đảng?", "options": [{"label": "a", "text": "Tài liệu tuyệt mật."}, {"label": "b", "text": "Tài liệu nội bộ."}, {"label": "c", "text": "Tài liệu lưu trữ."}, {"label": "d", "text": "Tài liệu mật."}], "answer": "d.", "correct": ["d"]}, {"id": 288, "section": "XIII. NỘI DUNG XÂY DỰNG ĐẢNG (10 CÂU)", "qnum": 8, "question": "Theo Quy định số 294-QĐ/TW ngày 26/5/2025 của Ban Chấp hành Trung ương khóa XIII: Nếu cấp ủy cơ sở không có điều kiện quản lý và bảo quản hồ sơ đảng viên, ai, cơ quan nào sẽ đảm nhiệm việc này?", "options": [{"label": "a", "text": "Ban Tổ chức cùng cấp."}, {"label": "b", "text": "Chính quyền địa phương."}, {"label": "c", "text": "Đảng viên tự bảo quản hồ sơ của mình."}, {"label": "d", "text": "Cấp ủy cấp trên trực tiếp."}], "answer": "d.", "correct": ["d"]}, {"id": 289, "section": "XIII. NỘI DUNG XÂY DỰNG ĐẢNG (10 CÂU)", "qnum": 9, "question": "Theo Quy định số 294-QĐ/TW ngày 26/5/2025 của Ban Chấp hành Trung ương khóa XIII: Cấp ủy nào quản lý phiếu đảng viên và danh sách đảng viên của đảng bộ, chi bộ cơ sở trực thuộc?", "options": [{"label": "a", "text": "Chi bộ cơ sở."}, {"label": "b", "text": "Cấp ủy cấp trên trực tiếp của tổ chức cơ sở đảng."}, {"label": "c", "text": "Ban Tổ chức cấp ủy cấp trên."}, {"label": "d", "text": "Đảng ủy cơ sở."}], "answer": "b.", "correct": ["b"]}, {"id": 290, "section": "XIII. NỘI DUNG XÂY DỰNG ĐẢNG (10 CÂU)", "qnum": 10, "question": "Theo Quy định số 294-QĐ/TW ngày 26/5/2025 của Ban Chấp hành Trung ương khóa XIII: Hằng năm, các cấp ủy có trách nhiệm gì đối với việc bổ sung lý lịch đảng viên và quản lý hồ sơ đảng viên?", "options": [{"label": "a", "text": "Thu thập hồ sơ đảng viên mới."}, {"label": "b", "text": "Chỉ đạo hướng dẫn đảng viên tự bổ sung lý lịch."}, {"label": "c", "text": "Thông kế số lượng đảng viên."}, {"label": "d", "text": "Chỉ đạo, kiểm tra việc bổ sung lý lịch đảng viên và quản lý hồ sơ đảng viên."}], "answer": "d.", "correct": ["d"]}, {"id": 291, "section": "CÂU HỎI PHỤ PHẦN THI TUYÊN TRUYỀN I. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG", "qnum": 1, "question": "Đồng chí hãy cho biết chủ đề, phương châm Đại hội đại biểu toàn quốc lần thứ XIV của Đảng?", "options": [], "answer": "- Chủ đề đại hội: Dưới lá cờ vẻ vang của Đảng, toàn Đảng, toàn dân, toàn quân chung sức đồng lòng, quyết tâm đổi mới, hành động vì một Việt Nam hoà bình, độc lập, dân chủ, giàu mạnh, phồn vinh, văn minh, hạnh phúc, vững bước đi lên chủ nghĩa xã hội.\n- Phương châm: “Đoàn kết-Dân chủ-Kỷ cương-Đột phá-Phát triển”.", "correct": []}, {"id": 292, "section": "CÂU HỎI PHỤ PHẦN THI TUYÊN TRUYỀN I. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG", "qnum": 2, "question": "Nguy cơ bao trùm lớn nhất đối với nước ta trong giai đoạn tới là gì? Trả lời: Nguy cơ tụt hậu, nhất là về công nghệ và bẫy thu nhập trung bình.", "options": [], "answer": "", "correct": []}, {"id": 293, "section": "CÂU HỎI PHỤ PHẦN THI TUYÊN TRUYỀN I. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG", "qnum": 3, "question": "“Tự chủ chiến lược” trong báo cáo chính trị của Ban Chấp hành Trung ương Đảng khoá XIII tại Đại hội đại biểu toàn quốc lần thứ XIV của Đảng được hiểu như thế nào? Trả lời: Là năng lực làm chủ vận mệnh quốc gia trong thế giới đầy biến động, biết định vị đúng vị thế, lựa chọn đúng hướng đi và chủ động điều chỉnh phù hợp với yêu cầu thời đại", "options": [], "answer": "", "correct": []}, {"id": 294, "section": "CÂU HỎI PHỤ PHẦN THI TUYÊN TRUYỀN I. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG", "qnum": 4, "question": "Báo cáo chính trị của Ban Chấp hành Trung ương Đảng khoá XIII tại Đại hội đại biểu toàn quốc lần thứ XIV của Đảng xác định mối quan hệ được xác định là trung tâm - then chốt - nền tảng - trọng yếu là gì? Trả lời: Kinh tế – xã hội – văn hoá – quốc phòng, an ninh, đối ngoại.", "options": [], "answer": "", "correct": []}, {"id": 295, "section": "CÂU HỎI PHỤ PHẦN THI TUYÊN TRUYỀN I. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG", "qnum": 5, "question": "Mô hình chủ nghĩa xã hội Việt Nam với 3 trụ cột nền tảng được xác định trong báo cáo chính trị của Ban Chấp hành Trung ương Đảng khoá XIII tại Đại hội đại biểu toàn quốc lần thứ XIV của Đảng là gì? Trả lời: Nền kinh tế thị trường định hướng xã hội chủ nghĩa; Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam của Nhân dân, do Nhân dân, vì Nhân dân dưới sự lãnh đạo của Đảng Cộng sản Việt Nam; nền dân chủ xã hội chủ nghĩa.", "options": [], "answer": "", "correct": []}, {"id": 296, "section": "CÂU HỎI PHỤ PHẦN THI TUYÊN TRUYỀN I. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG", "qnum": 6, "question": "Mục tiêu tổng quát đến năm 2030 của đất nước là gì? Trả lời: Nước đang phát triển, có công nghiệp hiện đại, thu nhập trung bình cao.", "options": [], "answer": "", "correct": []}, {"id": 297, "section": "CÂU HỎI PHỤ PHẦN THI TUYÊN TRUYỀN I. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG", "qnum": 7, "question": "Tầm nhìn phát triển đất nước đến năm 2045 là gì? Trả lời: Nước phát triển, thu nhập cao, xã hội phồn vinh, hạnh phúc.", "options": [], "answer": "", "correct": []}, {"id": 298, "section": "CÂU HỎI PHỤ PHẦN THI TUYÊN TRUYỀN I. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG", "qnum": 8, "question": "Vai trò của văn hoá được xác định như thế nào trong phát triển đất nước? Trả lời: Nền tảng tinh thần, nguồn lực nội sinh và động lực phát triển.", "options": [], "answer": "", "correct": []}, {"id": 299, "section": "CÂU HỎI PHỤ PHẦN THI TUYÊN TRUYỀN I. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG", "qnum": 9, "question": "Xây dựng Đảng được xác định giữ vai trò gì trong tổng thể các nhiệm vụ? Trả lời: Then chốt, quyết định sự lãnh đạo toàn diện.", "options": [], "answer": "", "correct": []}, {"id": 300, "section": "CÂU HỎI PHỤ PHẦN THI TUYÊN TRUYỀN I. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG", "qnum": 10, "question": "Mục tiêu tăng trưởng GDP bình quân giai đoạn 2026–2030 là bao nhiêu? Trả lời: Từ 10%/năm trở lên.", "options": [], "answer": "", "correct": []}, {"id": 301, "section": "II. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU ĐẢNG BỘ QUÂN ĐỘI LẦN THỨ XII", "qnum": 1, "question": "Đại hội đại biểu Đảng bộ Quân đội lần thứ XII được tiến hành theo phương châm như thế nào? Trả lời: “Đoàn kết - Dân chủ - Kỷ cương - Kiên định - Đột phá - Phát triển”", "options": [], "answer": "", "correct": []}, {"id": 302, "section": "II. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU ĐẢNG BỘ QUÂN ĐỘI LẦN THỨ XII", "qnum": 2, "question": "Yêu cầu xuyên suốt trong bảo vệ Tổ quốc được nhấn mạnh là gì? Trả lời: Bảo vệ Tổ quốc từ sớm, từ xa, không để bị động, bất ngờ.", "options": [], "answer": "", "correct": []}, {"id": 303, "section": "II. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU ĐẢNG BỘ QUÂN ĐỘI LẦN THỨ XII", "qnum": 3, "question": "Yếu tố quyết định xây dựng Quân đội vững mạnh toàn diện là gì? Trả lời: Vững mạnh về chính trị.", "options": [], "answer": "", "correct": []}, {"id": 304, "section": "II. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU ĐẢNG BỘ QUÂN ĐỘI LẦN THỨ XII", "qnum": 4, "question": "3 đột phá được xác định trong Đại hội đại biểu Đảng bộ Quân đội lần thứ XII là gì?", "options": [], "answer": "1. Hoàn thiện đồng bộ thể chế quân sự, quốc phòng; huy động hiệu quả các nguồn lực xây dựng Quân đội cách mạng, chính quy, tinh nhuệ, hiện đại.\n2. Tập trung phát triển nguồn nhân lực chất lượng cao; đẩy mạnh thu hút, trọng dụng nhân tài, xây dựng đội ngũ cán bộ đáp ứng yêu cầu xây dựng Quân đội hiện đại; nâng cao chất lượng xây dựng chính quy, quản lý kỷ luật; phát huy giá trị văn hóa “Bộ đội Cụ Hồ” thời kỳ mới.\n3. Đẩy mạnh phát triển khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số; phát triển công nghiệp quốc phòng tự chủ, tự lực, tự cường, lưỡng dụng, hiện đại.", "correct": []}, {"id": 305, "section": "II. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU ĐẢNG BỘ QUÂN ĐỘI LẦN THỨ XII", "qnum": 5, "question": "Hình thái chiến tranh tương lai được Đại hội đại biểu Đảng bộ Quân đội lần thứ XII nhấn mạnh là gì? Trả lời: Chiến tranh công nghệ cao.", "options": [], "answer": "", "correct": []}, {"id": 306, "section": "II. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU ĐẢNG BỘ QUÂN ĐỘI LẦN THỨ XII", "qnum": 6, "question": "Công nghiệp quốc phòng được xây dựng theo phương châm nào? Trả lời: Tự chủ, tự lực, tự cường, lưỡng dụng, hiện đại.", "options": [], "answer": "", "correct": []}, {"id": 307, "section": "II. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU ĐẢNG BỘ QUÂN ĐỘI LẦN THỨ XII", "qnum": 7, "question": "Đại hội đại biểu Đảng bộ Quân đội lần thứ XII xác định nội dung “2 kiên định, 2 đẩy mạnh và 2 ngăn ngừa” là gì?", "options": [], "answer": "1. “2 kiên định”\n2. “2 đẩy mạnh”\n3. “2 ngăn ngừa”", "correct": []}, {"id": 308, "section": "II. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU ĐẢNG BỘ QUÂN ĐỘI LẦN THỨ XII", "qnum": 8, "question": "Bài học kinh nghiệm quan trọng đầu tiên được rút ra từ nhiệm kỳ vừa qua của Quân đội ta là gì? Trả lời: Giữ vững và tăng cường sự lãnh đạo tuyệt đối, trực tiếp về mọi mặt của Đảng, xây dựng Quân đội vững mạnh về mọi mặt.", "options": [], "answer": "", "correct": []}, {"id": 309, "section": "II. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU ĐẢNG BỘ QUÂN ĐỘI LẦN THỨ XII", "qnum": 9, "question": "Phương hướng xây dựng Quân đội trong thời gian tiếp theo là gì? Trả lời: Xây dựng Quân đội cách mạng, chính quy, tinh nhuệ, hiện đại.", "options": [], "answer": "", "correct": []}, {"id": 310, "section": "II. CÂU HỎI VỀ ĐẠI HỘI ĐẠI BIỂU ĐẢNG BỘ QUÂN ĐỘI LẦN THỨ XII", "qnum": 10, "question": "Phương châm “5 vững” được xác định trong Đại hội đại biểu Đảng bộ Quân đội lần thứ XII là gì?", "options": [], "answer": "1. Chính trị vững\n2. Kỷ luật vững\n3. Công nghệ vững\n4. Nghệ thuật quân sự vững\n5. Đời sống bộ đội vững", "correct": []}, {"id": 311, "section": "III. CÂU HỎI CHUYÊN NGÀNH BÁO CÁO VIÊN", "qnum": 1, "question": "Báo cáo viên cấp Sư đoàn do ai đảm nhiệm? Trà lời: Đồng chí bí thư cấp uỷ (hoặc phó bí thư), chủ nhiệm chính trị, phó chủ nhiệm chính trị, trưởng ban tuyên huấn, trợ lý tuyên truyền (trợ lý tuyên huấn hoặc trợ lý chính trị) cùng cấp đảm nhiệm.", "options": [], "answer": "", "correct": []}, {"id": 312, "section": "III. CÂU HỎI CHUYÊN NGÀNH BÁO CÁO VIÊN", "qnum": 2, "question": "Báo cáo viên cấp Trung đoàn do ai đảm nhiệm? Trà lời: Đồng chí Bí thư cấp uỷ, chủ nhiệm chính trị, phó chủ nhiệm chính trị (trưởng ban chính trị) cùng cấp đảm nhiệm.", "options": [], "answer": "", "correct": []}, {"id": 313, "section": "III. CÂU HỎI CHUYÊN NGÀNH BÁO CÁO VIÊN", "qnum": 3, "question": "Báo cáo viên cấp tiểu đoàn đủ quân do ai đảm nhiệm? Trà lời: Đồng chí chính trị viên, chính trị viên phó hoặc bí thư cấp uỷ cùng cấp đảm nhiệm.", "options": [], "answer": "", "correct": []}, {"id": 314, "section": "III. CÂU HỎI CHUYÊN NGÀNH BÁO CÁO VIÊN", "qnum": 4, "question": "Báo cáo viên cấp đại đội đủ quân đủ quân do ai đảm nhiệm? Trà lời: Đồng chí chính trị viên, chính trị viên phó hoặc bí thư cấp uỷ cùng cấp đảm nhiệm.", "options": [], "answer": "", "correct": []}, {"id": 315, "section": "III. CÂU HỎI CHUYÊN NGÀNH BÁO CÁO VIÊN", "qnum": 5, "question": "Đối tượng sĩ quan, quân nhân chuyên nghiệp, công nhân viên quốc phòng (người hưởng lương) mỗi tháng nghe nói chuyện thời sự một lần, thời gian bao lâu và do cấp nào tổ chức? Trả lời: Không quá 120 phút, do đơn vị cấp trung đoàn và tương đương trở lên tổ chức.", "options": [], "answer": "", "correct": []}, {"id": 316, "section": "III. CÂU HỎI CHUYÊN NGÀNH BÁO CÁO VIÊN", "qnum": 6, "question": "Đối tượng hạ sĩ quan, chiến sĩ mỗi tháng nghe nói chuyện thời sự một lần, thời gian bao lâu và do cấp nào tổ chức? Trả lời: Không quá 60 phút, do đơn vị cấp tiểu đoàn và tương đương tổ chức.", "options": [], "answer": "", "correct": []}, {"id": 317, "section": "III. CÂU HỎI CHUYÊN NGÀNH BÁO CÁO VIÊN", "qnum": 7, "question": "Đồng chí cho biết chế độ hội thi báo cáo viên được tổ chức như thế nào?", "options": [], "answer": "- Toàn quân, 5 năm một lần do Tổng cục Chính trị tổ chức.\n- Đơn vị trực thuộc Bộ Quốc phòng 5 năm 1 lần.\n- Cấp trên cơ sở và cấp cơ sở (trung đoàn và tương đương) 5 năm 2 lần, do cơ quan chính trị chủ trì.", "correct": []}, {"id": 318, "section": "III. CÂU HỎI CHUYÊN NGÀNH BÁO CÁO VIÊN", "qnum": 8, "question": "Đồng chí cho biết tập huấn, bồi dưỡng báo cáo viên được thực hiện ở cấp nào? Trả lời: Cấp toàn quân, cấp trực thuộc Bộ Quốc phòng, cấp sư đoàn và tương đương.", "options": [], "answer": "", "correct": []}, {"id": 319, "section": "III. CÂU HỎI CHUYÊN NGÀNH BÁO CÁO VIÊN", "qnum": 9, "question": "Đồng chí cho biết cấp sư đoàn và tương đương được quy định tổ chức tập huấn thời gian như thế nào? Trả lời: Ít nhất 2 năm 1 lần. Thời gian ít nhất 1 ngày.", "options": [], "answer": "", "correct": []}, {"id": 320, "section": "III. CÂU HỎI CHUYÊN NGÀNH BÁO CÁO VIÊN", "qnum": 10, "question": "Đồng chí cho biết báo cáo viên được khai thác thông tin từ những nguồn nào? Trà lời: Được khai thác thông tin từ nguồn chính thức kết hợp với khai thác trên các phương tiện truyền thông hiện đại, nhưng phải bảo đảm nguồn gốc rõ ràng, được kiểm duyệt của các cơ quan Đảng, Nhà nước và Quân đội, đúng quan điểm, đường lối của Đảng, pháp luật của Nhà nước, quy định của Quân đội, không ảnh hưởng đến lợi ích quốc gia dân tộc, sự nghiệp xây dựng và bảo vệ Tổ quốc.", "options": [], "answer": "", "correct": []}, {"id": 321, "section": "VI. MỘT SỐ KIẾN THỨC CHUNG", "qnum": 1, "question": "Chủ đề phong trào thi đua quyết thắng năm 2026 là gì? Trả lời: “Đoàn kết, kỷ cương, đột phá, sáng tạo, Quyết thắng”.", "options": [], "answer": "", "correct": []}, {"id": 322, "section": "VI. MỘT SỐ KIẾN THỨC CHUNG", "qnum": 2, "question": "Tư tưởng chỉ đạo phong trào thi đua quyết thắng năm 2026 là gì? Trả lời: “Tăng cường đoàn kết, giữ vững kỷ cương, quyết tâm đột phá, đổi mới sáng tạo, hoàn thành xuất sắc nhiệm vụ”.", "options": [], "answer": "", "correct": []}, {"id": 323, "section": "VI. MỘT SỐ KIẾN THỨC CHUNG", "qnum": 3, "question": "Chủ đề năm 2026 đối với Quân đội là gì? Trả lời: “Quyết tâm nghiên cứu, sản xuất vũ khí trang bị tiêu biểu, hiện đại”.", "options": [], "answer": "", "correct": []}, {"id": 324, "section": "VI. MỘT SỐ KIẾN THỨC CHUNG", "qnum": 4, "question": "Năm 2026 có ý nghĩa như thế nào đối với Quân đội? Trả lời: Là năm đầu tiên thực hiện chủ trương xây dựng Quân đội hiện đại và nền quốc phòng toàn dân hiện đại.", "options": [], "answer": "", "correct": []}, {"id": 325, "section": "VI. MỘT SỐ KIẾN THỨC CHUNG", "qnum": 5, "question": "Hãy trình bày phương châm “5 tránh” mà đồng chí Chính ủy Quân khu đã chỉ đạo? 1. Tránh buông lỏng nguyên tắc, coi thường kỷ cương 2. Tránh để mất đoàn kết, mềm dẻo nhưng cương quyết 3. Tránh làm việc theo lối mòn kinh nghiệm 4. Tránh thấy đúng không bảo vệ, thấy sai không đấu tranh 5. Tránh bệnh thành tích, báo cáo không đúng sự thật, che giấu khuyết điểm", "options": [], "answer": "", "correct": []}, {"id": 326, "section": "VI. MỘT SỐ KIẾN THỨC CHUNG", "qnum": 6, "question": "Hãy trình bày nguyên tắc “6 rõ” trong quản lý, điều hành mà đồng chí Chính ủy Quân khu đã chỉ đạo?", "options": [], "answer": "1. Rõ người\n2. Rõ việc\n3. Rõ thời gian\n4. Rõ trách nhiệm\n5. Rõ thẩm quyền\n6. Rõ kết quả", "correct": []}, {"id": 327, "section": "VI. MỘT SỐ KIẾN THỨC CHUNG", "qnum": 7, "question": "Đồng chí nêu các hình thức giáo dục chính trị cơ bản?", "options": [], "answer": "1. Học tập chính trị.\n2. Nghiên cứu chuyên đề của sĩ quan, quân nhân chuyên nghiệp.\n3. Sinh hoạt chính trị, tư tưởng.\n4. Thông báo chính trị - thời sự; đọc báo, nghe đài, xem truyền hình.\n5. Ngày chính trị và văn hoá tinh thần ở cơ sở.\n6. Học tập chính trị qua mạng máy tính nội bộ.", "correct": []}, {"id": 328, "section": "VI. MỘT SỐ KIẾN THỨC CHUNG", "qnum": 8, "question": "Ngoài 6 hình thức giáo dục chính trị cơ bản, công tác giáo dục chính trị còn được tiến hành thông qua hoạt động những hoạt động nào? Trả lời: Ngoài các hình thức cơ bản trên, giáo dục chính trị còn được tiến hành thông qua hoạt động thực hiện nhiệm vụ, phong trào thi đua, các cuộc vận động, kỷ niệm các ngày lễ lớn của dân tộc, của Đảng, của quân đội, ngày truyền thống của đơn vị; hoạt động văn hóa, văn nghệ và các thiết chế văn hóa, thiết chế dân chủ trong quân đội.", "options": [], "answer": "", "correct": []}, {"id": 329, "section": "VI. MỘT SỐ KIẾN THỨC CHUNG", "qnum": 9, "question": "Phương châm 4 không?", "options": [], "answer": "- Không tham gia bất cứ liên minh quân sự nào.\n- Không liên kết với nước này để chống nước kia.\n- Không cho nước ngoài đặt căn cứ quân sự tại Việt Nam\n- Không sử dụng vũ lực hoặc đe dọa sử dụng vũ lực đối với các nước khác.", "correct": []}, {"id": 330, "section": "VI. MỘT SỐ KIẾN THỨC CHUNG", "qnum": 10, "question": "Phương châm 4 tránh?", "options": [], "answer": "- Tránh xung đột về quân sự.\n- Tránh bị cô lập kinh tế.\n- Tránh bị cô lập về ngoại giao.\n- Tránh bị lệ thuộc chính trị.", "correct": []}];

  // ====== TIỆN ÍCH ======
  function normalizeText(s) {
    return (s || "")
      .toString()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d");
  }

  // Tạo chỉ mục tìm kiếm nhanh (chạy 1 lần khi tải trang)
  DATA.forEach(q => {
    const optText = (q.options || []).map(o => `${o.label}) ${o.text}`).join(" ");
    q._index = normalizeText(`${q.section} ${q.question} ${optText} ${q.answer}`);
  });

  const $q = document.getElementById("q");
  const $btnSearch = document.getElementById("btnSearch");
  const $btnClear = document.getElementById("btnClear");
  const $list = document.getElementById("list");
  const $empty = document.getElementById("empty");
  const $metaBar = document.getElementById("metaBar");
  const $count = document.getElementById("count");
  const $sub = document.getElementById("sub");
  const $chipTotal = document.getElementById("chipTotal");
  const $chipShown = document.getElementById("chipShown");
  const $moreWrap = document.getElementById("moreWrap");
  const $btnMore = document.getElementById("btnMore");

  const PAGE_SIZE = 20;
  let lastResults = [];
  let shown = 0;

  function escapeHtml(s) {
    return (s || "").toString()
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function renderItem(q) {
    const sec = q.section ? `<div class="sec">${escapeHtml(q.section)} • Câu ${q.qnum}</div>` : `<div class="sec">Câu ${q.qnum}</div>`;
    const question = `<div class="q">${escapeHtml(q.question)}</div>`;

    let optsHtml = "";
    if (q.options && q.options.length) {
      optsHtml = `<div class="opts">` + q.options.map(o => {
        const isCorrect = (q.correct || []).includes(o.label);
        return `<div class="opt ${isCorrect ? "correct" : ""}">
          <span class="label">${escapeHtml(o.label.toUpperCase())}</span>
          <span>${escapeHtml(o.text)}</span>
        </div>`;
      }).join("") + `</div>`;
    }

    const answerBlock = q.answer
      ? `<div class="answer">ĐÁP ÁN: ${escapeHtml(q.answer)}</div>`
      : "";

    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `
      <div class="itemTop">
        ${sec}
        ${question}
      </div>
      ${optsHtml}
      ${answerBlock}
    `;
    return el;
  }

  function updateMeta(total, shownNow, query) {
    $metaBar.style.display = "flex";
    $count.textContent = `Kết quả: ${total}`;
    $sub.textContent = query ? `Từ khóa: “${query}”` : "";
    $chipTotal.textContent = `Tổng câu trong bộ: ${DATA.length}`;
    $chipShown.textContent = `Đang hiển thị: ${shownNow}`;
  }

  function showEmpty(msg) {
    $empty.style.display = "block";
    $empty.textContent = msg;
    $metaBar.style.display = "none";
    $moreWrap.style.display = "none";
    $list.innerHTML = "";
  }

  function doSearch() {
    const raw = ($q.value || "").trim();
    if (!raw) {
      showEmpty("Nhập từ khóa ở ô tìm kiếm để bắt đầu.");
      lastResults = [];
      shown = 0;
      return;
    }

    const norm = normalizeText(raw);
    let results = [];

    // Nếu người dùng nhập số: ưu tiên tìm theo số câu (qnum)
    if (/^\d+$/.test(raw)) {
      const num = parseInt(raw, 10);
      results = DATA.filter(q => q.qnum === num);
      // Nếu không ra, fallback tìm text
      if (!results.length) {
        results = DATA.filter(q => q._index.includes(norm));
      }
    } else {
      results = DATA.filter(q => q._index.includes(norm));
    }

    lastResults = results;
    shown = 0;

    if (!results.length) {
      showEmpty(`Không tìm thấy kết quả cho “${raw}”.`);
      return;
    }

    $empty.style.display = "none";
    $list.innerHTML = "";
    renderMore(raw);
  }

  function renderMore(queryForMeta="") {
    const total = lastResults.length;
    const next = lastResults.slice(shown, shown + PAGE_SIZE);
    const frag = document.createDocumentFragment();
    next.forEach(q => frag.appendChild(renderItem(q)));
    $list.appendChild(frag);
    shown += next.length;

    updateMeta(total, shown, queryForMeta);

    if (shown < total) {
      $moreWrap.style.display = "block";
    } else {
      $moreWrap.style.display = "none";
    }
  }

  function clearAll() {
    $q.value = "";
    showEmpty("Nhập từ khóa ở ô tìm kiếm để bắt đầu.");
    lastResults = [];
    shown = 0;
    $q.focus();
  }

  // ====== SỰ KIỆN ======
  $btnSearch.addEventListener("click", doSearch);
  $btnClear.addEventListener("click", clearAll);
  $btnMore.addEventListener("click", () => renderMore(($q.value||"").trim()));

  $q.addEventListener("keydown", (e) => {
    if (e.key === "Enter") doSearch();
    if (e.key === "Escape") clearAll();
  });

  // Hiển thị tổng số câu
  document.getElementById("chipTotal").textContent = `Tổng câu trong bộ: ${DATA.length}`;
</script>
</body>
</html>
